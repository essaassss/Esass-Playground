<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revu Header</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <h1>revu</h1>
      <span class="underline"></span>
    </div>

    <!-- Hamburger icon (hidden on desktop) -->
    <div class="hamburger" id="hamburger">&#9776;</div>

    <nav class="nav-links" id="nav-links">
      <a href="#" class="active">Home</a>
      <a href="#">How it works</a>
      <a href="#">Pricing</a>
      <a href="#">Contact</a>
    </nav>

    <div class="auth-buttons">
      <button class="login-btn">Log in</button>
      <button class="signup-btn">Sign Up</button>
    </div>
  </header>
  <section class="hero" role="region" aria-label="Second chance hero">
    <div class="hero__wrap">
      <div class="hero__copy">
        <h1 class="hero__title">
          We believe <span class="accent">everyone</span><br />
          deserves a second<br />
          chance
        </h1>

        <p class="hero__sub">
          Revu your life. Reclaim your record.
        </p>

        <a class="btn btn--primary" href="#qualify">See if you qualify</a>
      </div>

      <div class="hero__art">
        <!-- Replace this src with your actual image -->
        <img
          src="images/hero1.png"
          alt="Documents symbolizing a new start"
          width="720" height="520" loading="eager" decoding="async"
        />
      </div>
    </div>
  </section>

  <script>
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('nav-links');

    hamburger.addEventListener('click', () => {
      navLinks.classList.toggle('show');
      hamburger.classList.toggle('open');
    });
  </script>
</body>
</html>
